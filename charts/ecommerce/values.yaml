replicaCount: 1

image:
  repository: 985539781710.dkr.ecr.us-east-2.amazonaws.com/ecommerce
  tag: "729ff7e"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: ""
  hosts:
    - host: ecommerce.example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 512Mi

env:
  COMPANY_NAME: "ExcelCloud Market"
  EMAIL_TRANSPORT: "ses"
  EMAIL_FROM: "enkengafac@etechconsultingsys.com"
  SES_REGION: "us-east-1"

# Optional SMTP fallback (set EMAIL_TRANSPORT=smtp and create the secret)
smtp:
  enabled: false
  host: ""
  port: "587"
  secretName: ecommerce-smtp

serviceAccount:
  create: true
  name: ecommerce
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::985539781710:role/ecommerce-ses-role

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"

serviceMonitor:
  enabled: true
  interval: 30s
  labels:
    release: kube-prometheus-stack

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
